[project]
name = "xtb-charts"
version = "0.1.0"
description = "Offline-first OHLC candlestick charts for a curated list of XTB instruments, backed by Yahoo Finance data in SQLite"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pandas>=3.0.5",
    "uvicorn>=0.52.1",
    "yfinance>=1.5.2",
]

[project.scripts]
xtb-charts = "xtb_charts.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xtb_charts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
